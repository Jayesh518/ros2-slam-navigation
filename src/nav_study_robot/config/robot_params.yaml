# Single source of truth for the robot: read by the URDF/SDF xacro files, the Nav2 configs and cad/make_robot_cad.py.
# Units: metres, kilograms, seconds. Heights are above the ground unless the name says otherwise.
# Design basis: ROBOTIS TurtleBot 3 Burger (Apache-2.0 files, ROBOTIS-GIT/turtlebot3_simulations) for size, wheels, LiDAR and
# speed limits; the layout of plates, standoffs and parts is our own design (cad/nav_study_robot_v1.step).
robot_name: nav_study_robot
# Reference numbers from the Burger specification (emanual.robotis.com): 138 x 178 x 192 mm, 1 kg, 0.22 m/s, 2.84 rad/s.
limits:
  max_linear_velocity: 0.22
  max_angular_velocity: 2.84
  max_linear_acceleration: 1.0
  max_angular_acceleration: 2.0
wheel:
  radius: 0.033
  width: 0.018
  separation: 0.160      # distance between wheel centres; overall width = separation + width = 0.178
  mass: 0.1
  mu: 1.0                # simulation friction (the Burger file says its own value is "not reliable")
caster:
  radius: 0.005
  x: -0.081
body:
  mass: 0.826            # base_link mass in the Burger file
  plate_length: 0.138
  plate_width: 0.140
  plate_thickness: 0.003
  plate_center_x: -0.064
  clip_radius: 0.135     # plates are the rectangle intersected with this circle about the axle centre
  plate_z0: [0.046, 0.098, 0.141]    # bottom, middle, top plate underside heights
  standoff_diameter: 0.006
  standoff_xy: [[-0.012, 0.055], [-0.116, 0.055]]   # mirrored in y
  motor: {x: 0.0, size: [0.040, 0.0205, 0.026], z0: 0.020}   # one per side, inside the wheel
  battery: {center: [-0.100, 0.0], size: [0.034, 0.090, 0.027]}
  controller: {center: [-0.035, 0.0], size: [0.050, 0.080, 0.012]}
  sbc: {center: [-0.075, 0.0], size: [0.085, 0.056, 0.017]}
lidar:
  x: -0.032
  radius: 0.0508
  height: 0.048          # top of the LiDAR is the robot's top: 0.192 m
  z0: 0.144
  sensor_z: 0.181        # scan plane height above the ground
  samples: 360
  update_rate: 5
  min_range: 0.12
  max_range: 3.5
  noise_stddev: 0.01     # fixed for all trials (protocol section 3)
imu:
  update_rate: 200
contact:
  box_height: 0.14       # simple collision box under the plates, as in the Burger file
frames:
  base_footprint_to_base_link_z: 0.033   # base_link sits at the axle centre
