# gz <-> ROS bridge for the robot. Contact sensors publish on their scoped topics (world name "default" in every study world).
- {topic_name: "/clock", ros_type_name: "rosgraph_msgs/msg/Clock", gz_type_name: "gz.msgs.Clock", direction: GZ_TO_ROS}
- {topic_name: "joint_states", ros_type_name: "sensor_msgs/msg/JointState", gz_type_name: "gz.msgs.Model", direction: GZ_TO_ROS}
- {topic_name: "odom", ros_type_name: "nav_msgs/msg/Odometry", gz_type_name: "gz.msgs.Odometry", direction: GZ_TO_ROS}
- {topic_name: "tf", ros_type_name: "tf2_msgs/msg/TFMessage", gz_type_name: "gz.msgs.Pose_V", direction: GZ_TO_ROS}
- {topic_name: "imu", ros_type_name: "sensor_msgs/msg/Imu", gz_type_name: "gz.msgs.IMU", direction: GZ_TO_ROS}
- {topic_name: "scan", ros_type_name: "sensor_msgs/msg/LaserScan", gz_type_name: "gz.msgs.LaserScan", direction: GZ_TO_ROS}
- {topic_name: "cmd_vel", ros_type_name: "geometry_msgs/msg/Twist", gz_type_name: "gz.msgs.Twist", direction: ROS_TO_GZ}
- {topic_name: "ground_truth", ros_type_name: "nav_msgs/msg/Odometry", gz_type_name: "gz.msgs.Odometry", direction: GZ_TO_ROS}
- {ros_topic_name: "contact/base", gz_topic_name: "/world/default/model/nav_study_robot/link/base_link/sensor/base_contact/contact", ros_type_name: "ros_gz_interfaces/msg/Contacts", gz_type_name: "gz.msgs.Contacts", direction: GZ_TO_ROS}
- {ros_topic_name: "contact/lidar", gz_topic_name: "/world/default/model/nav_study_robot/link/base_scan/sensor/lidar_contact/contact", ros_type_name: "ros_gz_interfaces/msg/Contacts", gz_type_name: "gz.msgs.Contacts", direction: GZ_TO_ROS}
- {ros_topic_name: "contact/wheel_left", gz_topic_name: "/world/default/model/nav_study_robot/link/wheel_left_link/sensor/wheel_left_contact/contact", ros_type_name: "ros_gz_interfaces/msg/Contacts", gz_type_name: "gz.msgs.Contacts", direction: GZ_TO_ROS}
- {ros_topic_name: "contact/wheel_right", gz_topic_name: "/world/default/model/nav_study_robot/link/wheel_right_link/sensor/wheel_right_contact/contact", ros_type_name: "ros_gz_interfaces/msg/Contacts", gz_type_name: "gz.msgs.Contacts", direction: GZ_TO_ROS}
